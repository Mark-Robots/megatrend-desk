name: Update Crypto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # ogni giorno alle 06:00 UTC

permissions:
  contents: write

concurrency:
  group: crypto-commit
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run crypto update
        run: python scripts/update_crypto.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/crypto_data.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Update crypto_data.json"
          # allinea al remoto prima del push (senza mascherare gli errori)
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "Push completato."
