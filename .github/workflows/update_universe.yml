name: Update Universe

on:
  schedule:
    # Venerdì 22:50 UTC — dopo la chiusura USA, in coda agli altri update settimanali
    - cron: "50 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universe-commit
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run universe update
        run: python scripts/update_universe.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/universe_data.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi
          git commit -m "Update universe_data.json"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
