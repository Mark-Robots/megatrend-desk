name: Update Megatrend Data
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy
      - name: Run ETF sector update script
        run: |
          echo "=== Running update_data.py ==="
          python scripts/update_data.py
      - name: Run stocks update script
        run: |
          echo "=== Running update_stocks.py ==="
          python scripts/update_stocks.py
          echo "=== EXIT CODE: $? ==="
      - name: Final check generated files
        run: |
          echo "=== Sizes ==="
          for f in data/sector_data.json data/stocks_data.json data/ranking_history.json; do
            if [ -f "$f" ]; then
              echo "EXISTS: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f"
            fi
          done
      - name: Commit and push changes
        run: |
          echo "=== Commit and push ==="
          git config --global user.name 'Megatrend Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add data/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "OK push al tentativo $i"
              exit 0
            fi
            echo "Push $i fallito: riallineo SENZA perdere i file generati"
            git pull --rebase -X ours origin main || {
              echo "rebase fallito, provo merge preservando i miei file"
              git merge -X ours origin/main -m "merge auto-update"
            }
            sleep $((i * 3))
          done
          echo "ERROR: push fallito dopo 5 tentativi"
          exit 1
