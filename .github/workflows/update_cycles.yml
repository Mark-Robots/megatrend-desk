name: Update Cycles Data

on:
  schedule:
    # 22:30 UTC nei giorni feriali — dopo la chiusura USA (16:00 ET)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
  repository_dispatch:
    types: [refresh-cycles]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fallback dependency (yfinance)
        run: pip install yfinance --quiet || true

      - name: Run cycle analysis
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python scripts/update_cycles.py
          echo "--- file generati in data/ ---"
          ls -la data/

      - name: Commit and push
        run: |
          git config user.name  "Cycles Bot"
          git config user.email "actions@github.com"
          git add -A data/
          git status --short
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Cycles Bot · Auto-update: $(date -u '+%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push tentativo $i fallito, riprovo..."
              sleep 3
            done
          fi
