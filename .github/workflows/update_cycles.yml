name: Update Cycles Data

on:
  schedule:
    # 22:30 UTC nei giorni feriali — dopo la chiusura USA (16:00 ET)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
  repository_dispatch:
    types: [refresh-cycles]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fallback dependency (yfinance)
        run: pip install yfinance --quiet || true

      - name: Run cycle analysis
        run: python scripts/update_cycles.py

      - name: Commit and push
        run: |
          git config user.name  "Cycles Bot"
          git config user.email "actions@github.com"
          git add data/cycles_data.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Cycles Bot · Auto-update: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
