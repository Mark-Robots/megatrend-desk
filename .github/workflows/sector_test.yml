name: Sector Test

on:
  workflow_dispatch:

jobs:
  sectest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run sector test
        run: python scripts/sector_test.py
