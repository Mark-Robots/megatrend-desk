name: Static Sector Test

on:
  workflow_dispatch:

jobs:
  stest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run static sector test
        run: python scripts/static_sector_test.py
