name: Intra Rotation Test

on:
  workflow_dispatch:

jobs:
  intra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run intra-sector rotation test
        run: python scripts/intra_rotation_test.py
