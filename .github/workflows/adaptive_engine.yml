name: Adaptive Engine

on:
  schedule:
    # Venerdì 14:05 UTC = 16:05 italiane (estive) — allineato agli altri update delle quotazioni
    - cron: "5 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run adaptive engine
        run: python scripts/adaptive_engine.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/adaptive_data.json
          git diff --staged --quiet && exit 0
          git commit -m "Adaptive: $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git pull --rebase origin main
          git push
