name: StopLoss Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy
      - name: Run stop-loss test
        run: python scripts/stoploss_test.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/stoploss_test.json
          git diff --staged --quiet && exit 0
          git commit -m "StopLoss test: $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git pull --rebase origin main
          git push
