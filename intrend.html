<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best in Class · Megatrend Desk</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--panel:#11151c;--panel2:#161b24;--line:#222a35;--soft:#1a2029;
--txt:#e8edf4;--dim:#8a96a6;--faint:#5a6573;--gold:#f5b301;--orange:#ff7a18;--green:#3ddc84;--blue:#5b9dff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',monospace;line-height:1.5;
padding:34px 20px 60px;background-image:radial-gradient(circle at 80% 0%, rgba(61,220,132,.05), transparent 45%)}
.wrap{max-width:920px;margin:0 auto}
.brand-mark{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.brand-row{display:flex;align-items:center;gap:16px}
.brand-logo{height:64px;width:64px;border-radius:8px;overflow:hidden;flex-shrink:0}
.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.brand h1{font-family:'Fraunces',Georgia,serif;font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:64px;margin:0;display:flex;align-items:center}
.title-gold{color:var(--orange);text-shadow:0 0 28px rgba(255,122,24,.35),0 0 60px rgba(255,122,24,.15);font-weight:700}
.title-light{color:#e8eaed;font-weight:500}
.title-separator{width:1px;height:50px;margin:0 12px;flex-shrink:0;position:relative;align-self:center;
  background:linear-gradient(180deg,transparent 0%,rgba(255,122,24,.55) 50%,transparent 100%)}
.title-separator::before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--orange);
  top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 18px var(--orange),0 0 5px var(--orange);
  animation:brand-pulse 2.8s ease-in-out infinite}
@keyframes brand-pulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.5;transform:translate(-50%,-50%) scale(.85)}}
@media(max-width:640px){.brand h1{font-size:44px;line-height:44px}.brand-logo{height:48px;width:48px}.title-separator{height:34px;margin:0 8px}.title-separator::before{width:5px;height:5px}}
.sub{font-size:11px;color:var(--dim);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:24px}
.box{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--green);opacity:.7}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bname{font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg{font-size:8px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--soft);border-radius:4px;padding:1px 5px;flex:none}
.new{font-size:8px;letter-spacing:.08em;color:var(--gold);border:1px solid rgba(245,179,1,.4);border-radius:4px;padding:1px 5px;flex:none}
.bdal{font-size:9.5px;color:var(--faint);margin-bottom:10px}
.stk{padding:7px 0 6px;border-top:1px solid var(--soft)}
.sr1{display:flex;align-items:baseline;gap:8px}
.snum{font-size:9px;color:var(--faint);flex:none;width:10px}
.stick{font-size:12px;font-weight:700;flex:none}
.snm{font-size:10px;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sperf{margin-left:auto;font-size:11.5px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.sperf.pos{color:var(--green)}.sperf.neg{color:#ff5c5c}
.sr2{display:flex;align-items:center;gap:8px;margin-top:3px;padding-left:18px}
.spark{flex:1;height:24px}
.spark polyline{fill:none;stroke-width:1.5}
.stag{font-size:8px;letter-spacing:.05em;color:var(--green);border:1px solid rgba(61,220,132,.3);
border-radius:4px;padding:1px 6px;flex:none;white-space:nowrap}
.pend{font-size:10px;color:var(--faint);padding:8px 0 2px;border-top:1px solid var(--soft)}
.empty{margin-top:24px;font-size:11px;color:var(--faint)}
</style>
</head>

        <span class="title-gold">Best</span>
        <span class="title-separator"></span>
        <span class="title-light">in Class</span>

    </div>
  </div>
  <div class="sub">i settori in trend · e le loro migliori azioni</div>
  <div class="sub" id="updated">caricamento…</div>
  <div class="grid" id="grid"></div>
  
</div>
<script>
const M=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fd=s=>{if(!s)return'—';const p=s.split('-');return `${+p[2]} ${M[+p[1]-1]} ${p[0].slice(2)}`;};
const TAG_IT={top_momentum:'top momentum',premium_ok:'premium',high_momentum:'alto momentum',
steady_growth:'crescita solida',value_momentum:'value momentum',recovery:'in recupero',
fresh_leader:'leader fresco',value_trap:'value trap',expensive_flat:'caro e fermo',
stagnant:'stagnante',mixed:'misto'};

async function load(){
  try{
    const bust='?_='+Date.now();
    const [sd,un,ist]=await Promise.all([
      fetch('data/sector_data.json'+bust).then(r=>r.json()),
      fetch('data/universe_data.json'+bust).then(r=>r.json()).catch(()=>({sectors:[]})),
      fetch('data/intrend_stocks.json'+bust).then(r=>r.json()).catch(()=>null)
    ]);
    document.getElementById('updated').textContent=
      'dati al '+fd(sd.last_data_date)+' · la lista si rinnova a ogni aggiornamento';

    const rows=[];
    ((sd.ranking&&sd.ranking.ranking)||[]).forEach(s=>{
      if(s.opSignal!=='IN')return;
      rows.push({key:s.ticker_raw||s.ticker, name:s.name||s.ticker,
        region:(s.region==='USA')?'USA':'EU',
        entry:(s.opCurrent&&s.opCurrent.start_date)||null,
        weeks:(s.opCurrent&&s.opCurrent.weeks)!=null?s.opCurrent.weeks:null});
    });
    (un.sectors||[]).forEach(s=>{
      if(s.opSignal!=='IN')return;
      rows.push({key:s.ticker, name:s.name||s.ticker,
        region:(s.region==='USA'||s.region==='US')?'USA':(s.region||'EU'),
        entry:s.trend_start_date||null,
        weeks:(s.weeks_in_trend!=null)?s.weeks_in_trend:null});
    });
    rows.sort((a,b)=>(b.entry||'').localeCompare(a.entry||''));

    const stocksOf=k=>{
      if(!ist||!ist.sectors)return null;
      const e=ist.sectors[k]||ist.sectors[String(k).replace('.DE','')];
      return e&&e.stocks&&e.stocks.length?e.stocks:null;
    };

    document.getElementById('grid').innerHTML = rows.length ? rows.map(d=>{
      const st=stocksOf(d.key);
      const spark=x=>{
        if(!x.series||x.series.length<2)return'';
        const v=x.series, n=v.length, W=100, H=24;
        let mn=Math.min(...v), mx=Math.max(...v); const sp=Math.max(1e-9,mx-mn);
        const pts=v.map((y,i)=>`${(i/(n-1)*W).toFixed(1)},${(H-2-(y-mn)/sp*(H-4)).toFixed(1)}`).join(' ');
        const col=(x.perf!=null&&x.perf<0)?'#ff5c5c':'#3ddc84';
        return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" stroke="${col}"/></svg>`;
      };
      const body=st
        ? st.map((x,i)=>`<div class="stk">
            <div class="sr1"><span class="snum">${i+1}</span>
              <span class="stick">${x.ticker}</span><span class="snm">${x.name&&x.name!==x.ticker?x.name:''}</span>
              ${x.perf!=null?`<span class="sperf ${x.perf>=0?'pos':'neg'}">${x.perf>=0?'+':''}${x.perf.toFixed(1)}%</span>`:''}</div>
            <div class="sr2">${spark(x)}<span class="stag">${TAG_IT[x.tag]||x.tag||''}</span></div>
          </div>`).join('')
        : `<div class="pend">titoli al prossimo aggiornamento</div>`;
      return `<div class="box">
        <div class="bh"><span class="bname">${d.name}</span><span class="reg">${d.region}</span>
          ${(d.weeks!=null&&d.weeks<=5)?'<span class="new">nuovo</span>':''}</div>
        <div class="bdal">in trend dal ${fd(d.entry)}</div>
        ${body}
      </div>`;
    }).join('') : '<div class="empty">Nessun settore in trend: tutto in liquidità.</div>';
  }catch(e){
    document.getElementById('updated').textContent='errore dati: '+e.message;
  }
}
load();
</script>
